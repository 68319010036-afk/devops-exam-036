<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Dashboard - 036</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-color: #0d1117;
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.12) 0px, transparent 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Fira Code', 'Kanit', monospace;
            padding: 20px;
        }

        .console-card {
            width: 100%;
            max-width: 520px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        /* แถบด้านบนสไตล์ Window Bar */
        .console-header {
            background: #21262d;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #30363d;
        }

        .window-dots {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot-red { background-color: #ff5f56; }
        .dot-yellow { background-color: #ffbd2e; }
        .dot-green { background-color: #27c93f; }

        .console-title {
            color: #8b949e;
            font-size: 13px;
            font-weight: 600;
        }

        /* ส่วนเนื้อหาหลัก */
        .console-body {
            padding: 28px;
        }

        .main-heading {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #58a6ff;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .info-grid {
            display: grid;
            gap: 16px;
            margin-bottom: 28px;
        }

        .info-item {
            background: #0d1117;
            border: 1px solid #21262d;
            border-left: 4px solid #38bdf8;
            border-radius: 8px;
            padding: 14px 18px;
        }

        .info-item.title-item {
            border-left-color: #a855f7;
        }

        .info-label {
            color: #8b949e;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
            display: block;
        }

        .info-value {
            color: #f0f6fc;
            font-size: 15px;
            font-weight: 600;
        }

        /* แถบสถานะ Server/Container */
        .status-bar {
            background: rgba(46, 160, 67, 0.15);
            border: 1px solid rgba(46, 160, 67, 0.4);
            border-radius: 10px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #3fb950;
            font-size: 14px;
            font-weight: 600;
        }

        .pulse-icon {
            width: 10px;
            height: 10px;
            background-color: #2ea043;
            border-radius: 50%;
            box-shadow: 0 0 10px #2ea043;
            animation: blink 1.5s infinite;
        }

        .status-tag {
            background: #2ea043;
            color: #ffffff;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 700;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="console-card">
        <!-- แถบด้านบนสุด -->
        <div class="console-header">
            <div class="window-dots">
                <span class="dot dot-red"></span>
                <span class="dot dot-yellow"></span>
                <span class="dot dot-green"></span>
            </div>
            <div class="console-title">devops-deployment.log</div>
            <div style="width: 52px;"></div>
        </div>

        <!-- ตัวเนื้อหา -->
        <div class="console-body">
            <div class="main-heading">
                <span>🚀</span>
                <span>Web Application CI/CD</span>
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <span class="info-label">Developer / Student</span>
                    <span class="info-value">Kawarin Chotirat (036)</span>
                </div>

                <div class="info-item title-item">
                    <span class="info-label">Project Scope</span>
                    <span class="info-value">Web Application CI/CD</span>
                </div>
            </div>

            <div class="status-bar">
                <div class="status-left">
                    <span class="pulse-icon"></span>
                    <span>Container Running Successfully</span>
                </div>
                <span class="status-tag">ACTIVE</span>
            </div>
        </div>
    </div>

</body>
</html>
